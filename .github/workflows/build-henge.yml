# Manual builds of the selected iCloud branch. No account login runs in CI.
name: Build Henge IPA
run-name: Henge Build 104 - ${{ github.ref_name }}

on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  HUSK: ${{ github.workspace }}/Husk
  IOS_DEPS: ${{ github.workspace }}/Husk/build/ios-arm64/sysroot

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4
        with:
          path: Henge
          fetch-depth: 0

      - name: Check out pinned Husk dependencies
        uses: actions/checkout@v4
        with:
          repository: Leviidev/Husk
          ref: 29abb512d81bf8cc08babcbe7f7007cb557208ef
          path: Husk

      - name: Cache Husk sources and iOS libraries
        uses: actions/cache@v4
        with:
          path: |
            Husk/third_party/build
            Husk/build
          key: husk-ios-arm64-${{ hashFiles('Husk/scripts/build_ios.sh', 'Husk/scripts/fetch_sources.sh') }}

      - name: Install build tools
        run: |
          set -euxo pipefail
          brew install xcodegen meson ninja pkg-config
          rustup target add aarch64-apple-ios || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            rustup target add aarch64-apple-ios
          }
          mkdir -p "$HOME/Desktop"

      - name: Check iCloud identity and kernel policy regressions
        working-directory: Henge
        run: |
          set -o pipefail
          mkdir -p build
          make test-legacy-vmm test-legacy-dtree test-compat test-software-identity 2>&1 | tee build/icloud-native-regression.log

      - name: Fetch Husk third-party sources
        working-directory: Husk
        run: bash scripts/fetch_sources.sh

      - name: Build iOS networking libraries
        working-directory: Husk
        run: bash scripts/build_ios.sh libffi glib libslirp

      - name: Build on-device pairing library
        working-directory: Husk
        run: bash scripts/build_rppairing_ios.sh

      - name: Copy dependencies into Henge
        working-directory: Henge
        run: zsh ios/scripts/fetch_deps.sh

      - name: Build restore stack
        working-directory: Henge
        run: zsh tools/build_ios_restore.sh

      - name: Build engine
        working-directory: Henge
        run: make ios-lib

      - name: Package Henge.ipa
        working-directory: Henge
        run: zsh ios/scripts/package_ipa.sh

      - name: Package Henge.tipa
        working-directory: Henge
        run: zsh ios/scripts/package_ipa.sh --trollstore

      - name: Validate both iCloud packages
        working-directory: Henge
        run: |
          python3 tools/validate_icloud_ci_package.py \
            "$HOME/Desktop/Henge.ipa" "$HOME/Desktop/Henge.tipa" \
            --commit "$GITHUB_SHA" --output build/icloud-packages.json

      - name: Upload Henge.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Henge-ipa-${{ github.sha }}
          path: /Users/runner/Desktop/Henge.ipa
          if-no-files-found: error

      - name: Upload Henge.tipa
        uses: actions/upload-artifact@v4
        with:
          name: Henge-tipa-${{ github.sha }}
          path: /Users/runner/Desktop/Henge.tipa
          if-no-files-found: error

      - name: Upload validation and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Henge-validation-${{ github.sha }}
          path: |
            Henge/build/icloud-packages.json
            Henge/build/icloud-native-regression.log
            Henge/ios/build/DerivedData.buildlog
          if-no-files-found: warn
